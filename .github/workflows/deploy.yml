# Deploy on every push to main.
#
# Content lives in Sanity, not in Git. An editor publishing in Sanity Studio
# fires a webhook that triggers a Cloudflare build (see the "Publish -> rebuild"
# step in studio/sanity.config.ts and the Sanity dashboard). Code changes land
# here and take the same build path. Drafts never reach the live site.
#
# THE ONE THING THAT IS EASY TO GET WRONG:
#
# `wrangler deploy --config dist/server/wrangler.json`, NOT a bare
# `wrangler deploy` against the repo-root wrangler.toml. The root config has no
# `main`, so wrangler ships an ASSETS-ONLY Worker: every static page keeps
# working while every on-demand route (the draft preview at /preview/* and the
# draft-mode API) silently does not exist. @astrojs/cloudflare writes the
# correct config into dist/server/ during the build; we deploy that one.

name: Deploy

on:
  push:
    branches: [main]
  # Lets us re-run a deploy from the Actions tab without pushing an empty commit.
  workflow_dispatch:

  # How a Sanity publish reaches this workflow: Sanity -> webhook ->
  # /api/rebuild on the live site -> GitHub repository_dispatch -> here.
  repository_dispatch:
    types: [sanity-publish]

  # Nightly safety net. The publish webhook is the fast path; this catches the
  # case where a webhook was missed or a build failed silently. Costs about two
  # build minutes a month. Off the hour so we never contend with every other
  # cron on the internet.
  schedule:
    - cron: '17 3 * * *'

# One deploy at a time per branch. A second push while a build is running waits
# instead of racing — two concurrent wrangler deploys to the same Worker
# overwrite each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    # GitHub's default is NO timeout — a blocked step runs until the 6-hour job
    # ceiling. Any step here that can block must be bounded by hand.
    timeout-minutes: 10

    # Read-only on contents. Nothing here needs to push back to the repo.
    permissions:
      contents: read

    steps:
      - name: Check out the commit that triggered this
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        # The dataset is public, so prerendered pages read Sanity without a
        # token. If it ever becomes private, add SANITY_API_READ_TOKEN as a
        # repository secret and map it into the env block below.
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Deploy to Cloudflare Workers
        # See the note at the top of this file: deploying the root
        # wrangler.toml instead ships an assets-only Worker and silently drops
        # every on-demand route.
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}